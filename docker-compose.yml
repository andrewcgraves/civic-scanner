services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: civic
      POSTGRES_USER: civic
      POSTGRES_PASSWORD: civic
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic -d civic"]
      interval: 2s
      timeout: 5s
      retries: 15

  objectstore:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: civic-audio
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://localhost:9090/civic-audio?list-type=2'"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
