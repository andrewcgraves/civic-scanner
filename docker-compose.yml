# Local development only: Postgres for the API. Start with `make dev-db`.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: civic
      POSTGRES_USER: civic
      POSTGRES_PASSWORD: civic
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic -d civic"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
