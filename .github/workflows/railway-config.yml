name: Railway config

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - ".railway/**"

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: railway-config-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: production
            token: RAILWAY_TOKEN
            artifact: railway-plan
            comment: "true"
          - environment: staging
            token: RAILWAY_TOKEN_STAGING
            artifact: railway-plan-staging
            comment: "false"
    name: plan (${{ matrix.environment }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1.2.0
        with:
          command: plan
          railway-token: ${{ secrets[matrix.token] }}
          artifact-name: ${{ matrix.artifact }}
          comment: ${{ matrix.comment }}
      - name: Summarize plan
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          {
            echo "### Railway config plan: $ENVIRONMENT"
            echo
            echo "$(jq '.changeSet.changes // [] | length' railway-plan.json) changes, destructive: $(jq '.destructive // false' railway-plan.json)"
            echo
            echo '```diff'
            jq -r '.diff // ""' railway-plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: production
            token: RAILWAY_TOKEN
            artifact: railway-plan
          - environment: staging
            token: RAILWAY_TOKEN_STAGING
            artifact: railway-plan-staging
    name: apply (${{ matrix.environment }})
    environment: railway-${{ matrix.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1.2.0
        with:
          command: apply
          railway-token: ${{ secrets[matrix.token] }}
          artifact-name: ${{ matrix.artifact }}
