openapi: 3.0.3
info:
  title: Civic Scanner API
  version: 1.0.0
  description: >-
    Public meeting tracker API. This file is the single source of truth for the
    v1 contract; Go server types and the TypeScript client are generated from it.
  license:
    name: Proprietary
    url: https://github.com/andrewcgraves/civic-scanner
servers:
  - url: /v1
    description: Version 1
tags:
  - name: system
    description: Operational endpoints.
  - name: agencies
    description: Tracked public agencies.
  - name: meetings
    description: Meetings of tracked agencies.
  - name: users
    description: Signed-in users.
  - name: billing
    description: The paid plan, through Stripe.
  - name: webhooks
    description: Webhook subscriptions to agencies, for paid users.
  - name: admin
    description: Routes for admins only.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and readiness probe
      description: Reports whether the API is up and can reach its database.
      tags: [system]
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          description: Service is unhealthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /agencies:
    get:
      operationId: listAgencies
      summary: List tracked agencies
      description: Returns every live agency the tracker follows.
      tags: [agencies]
      security: []
      responses:
        "200":
          description: The tracked agencies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencyList"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agencies/{slug}:
    get:
      operationId: getAgency
      summary: Get a tracked agency
      description: >-
        Returns one live agency by slug. An unknown slug and an agency that is
        not live both return the same 404.
      tags: [agencies]
      security: []
      parameters:
        - $ref: "#/components/parameters/AgencySlug"
      responses:
        "200":
          description: The agency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agency"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agencies/{slug}/meetings:
    get:
      operationId: listAgencyMeetings
      summary: List an agency's meetings
      description: >-
        Returns a live agency's meetings, newest first by start time, ties
        broken by meeting id. Pages are keyset-paginated: pass `nextCursor`
        from one page as `cursor` to get the next. A meeting added between
        requests never causes another meeting to be skipped or repeated. An
        unknown slug and an agency that is not live both return the same 404;
        a live agency with no meetings returns an empty list.
      tags: [agencies]
      security: []
      parameters:
        - $ref: "#/components/parameters/AgencySlug"
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque cursor from a previous page's `nextCursor`. Omit for the
            first page. A cursor that is malformed, altered, or from another
            agency is rejected with 400.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of meetings to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: One page of the agency's meetings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agencies/{slug}/feed.xml:
    get:
      operationId: getAgencyFeed
      summary: Get an agency's RSS feed
      description: >-
        An RSS 2.0 feed of a live agency's latest meeting events (agenda
        published, agenda changed, transcript ready), newest first, at most
        50 items. Each item links to the public meeting page and has the
        event id as its GUID. Supports conditional requests with
        `If-None-Match`. Behind the `agency-rss-feeds` flag; while the flag
        is off, and for an unknown slug or an agency that is not live, the
        response is the same 404.
      tags: [agencies]
      security: []
      parameters:
        - $ref: "#/components/parameters/AgencySlug"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          $ref: "#/components/responses/AgencyFeed"
        "304":
          $ref: "#/components/responses/NotModified"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    head:
      operationId: headAgencyFeed
      summary: Get the headers of an agency's RSS feed
      description: The same as `GET` without the body.
      tags: [agencies]
      security: []
      parameters:
        - $ref: "#/components/parameters/AgencySlug"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          $ref: "#/components/responses/AgencyFeed"
        "304":
          $ref: "#/components/responses/NotModified"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /meetings/{id}:
    get:
      operationId: getMeeting
      summary: Get a meeting
      description: >-
        Returns one meeting of a live agency with its latest agenda version and
        its recordings, each with its transcript once one exists. The agenda
        carries the agency's original document URL and each recording the
        agency's original recording URL. The full agenda text is not returned;
        the summary and the document link are. An unknown id and a meeting of
        an agency that is not live both return the same 404; an id that is not
        a UUID is a 400 (`invalid_parameter`).
      tags: [meetings]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: The meeting's id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The meeting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me:
    get:
      operationId: getMe
      summary: Get the signed-in user
      description: >-
        Returns the user the bearer token belongs to, a WorkOS access token.
        The first request with a valid token creates the user. The token is
        checked first: a missing or invalid token is a 401 and a token that
        cannot be checked a 503, whether or not accounts are turned on. A
        valid token for whom accounts are turned off is a 404. Every response
        carries `Cache-Control: no-store`.
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The signed-in user.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agency-submissions:
    post:
      operationId: createAgencySubmission
      summary: Submit an agency for review
      description: >-
        Creates a pending agency from a name and a website, recorded as
        submitted by the signed-in user. A pending agency never appears in any
        public response. The token is checked first, then the
        `agency-submissions` and `accounts` flags for that user, then the
        body: at most 16 KiB, `Content-Type: application/json` (a `charset`,
        if given, must be `utf-8`), and exactly one JSON object whose only
        members are the strings `name` and `website`, each at most once, with
        nothing after it. A website whose site is already on file, for an agency of any
        status, is a 409. A user with too many submissions awaiting review
        gets a 429. The submitted website is never fetched. Every response
        carries `Cache-Control: no-store`.
      tags: [agencies]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencySubmissionInput"
      responses:
        "201":
          description: The agency was submitted and is pending review.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencySubmission"
        "400":
          $ref: "#/components/responses/InvalidSubmission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/AlreadyOnFile"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/SubmissionLimit"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/agency-submissions:
    get:
      operationId: listPendingAgencySubmissions
      x-admin: true
      summary: List agencies awaiting review
      description: >-
        Lists the submitted agencies that are still pending, oldest
        submission first, at most 100. Approving or rejecting one takes it
        off the list, so the next ones appear. Admins only. Every response
        carries `Cache-Control: no-store`.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The pending submissions.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingAgencySubmissionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/agency-submissions/{id}/approve:
    post:
      operationId: approveAgencySubmission
      x-admin: true
      summary: Approve a submitted agency
      description: >-
        Makes a pending submitted agency live under the slug the admin
        chooses, so it appears in the public routes. Only a pending agency
        can be approved. Admins only. Every response carries
        `Cache-Control: no-store`.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencySubmissionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencyApprovalInput"
      responses:
        "200":
          description: The agency is live.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewedAgencySubmission"
        "400":
          $ref: "#/components/responses/InvalidApproval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/ReviewConflict"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/agency-submissions/{id}/reject:
    post:
      operationId: rejectAgencySubmission
      x-admin: true
      summary: Reject a submitted agency
      description: >-
        Rejects a pending submitted agency. It stays hidden from every public
        route, and its site stays on file, so it cannot be submitted again.
        Only a pending agency can be rejected. Admins only. Every response
        carries `Cache-Control: no-store`.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencySubmissionId"
      responses:
        "200":
          description: The agency is rejected.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewedAgencySubmission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/ReviewConflict"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /billing/checkout-session:
    post:
      operationId: createCheckoutSession
      summary: Start checkout for the paid plan
      description: >-
        Creates a Stripe Checkout Session for the paid plan and returns its
        URL; the client redirects the browser there. The first call creates
        the user's Stripe customer. Returning from Checkout does not make the
        user paid: the plan changes only when Stripe confirms the payment. The
        token is checked first, as for `GET /me`; a valid token for whom
        billing is turned off is a 404. Every response carries
        `Cache-Control: no-store`.
      tags: [billing]
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/BillingRedirect"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/BillingConflict"
        "502":
          $ref: "#/components/responses/BillingFailed"
        "503":
          $ref: "#/components/responses/BillingUnavailable"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /billing/portal-session:
    post:
      operationId: createBillingPortalSession
      summary: Open the Stripe billing portal
      description: >-
        Creates a Stripe billing portal session for the user's Stripe customer
        and returns its URL; the client redirects the browser there. A user
        who has never started checkout has no Stripe customer and gets a 409.
        Checks and caching are the same as for the checkout session.
      tags: [billing]
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/BillingRedirect"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/BillingConflict"
        "502":
          $ref: "#/components/responses/BillingFailed"
        "503":
          $ref: "#/components/responses/BillingUnavailable"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /billing/stripe-webhook:
    post:
      operationId: receiveStripeEvent
      summary: Receive a Stripe webhook event
      description: >-
        Stripe's webhook endpoint. Not for clients: it takes no bearer token
        and is authenticated only by the `Stripe-Signature` header, an
        HMAC-SHA256 of the raw body with the endpoint's signing secret, whose
        timestamp must be at most five minutes old. Checkout and subscription
        events keep the user's plan current. An event id already processed is
        answered 200 and changes nothing, and so is an event older than the
        last one applied to its subscription. Event types it does not handle
        are answered 200 and ignored. The body is at most 1 MiB.
      tags: [billing]
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: false
          description: Stripe's signature header, `t=<unix time>,v1=<hex HMAC>[,v1=...]`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeEvent"
      responses:
        "200":
          description: The event was received; `outcome` says what it did.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeEventReceipt"
        "400":
          $ref: "#/components/responses/InvalidStripeEvent"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/StripeEventTooLarge"
        "503":
          $ref: "#/components/responses/StripeWebhookNotConfigured"
        default:
          description: >-
            Unexpected error, such as a database error. Stripe retries the
            event later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /webhook-subscriptions:
    get:
      operationId: listWebhookSubscriptions
      summary: List the signed-in user's webhook subscriptions
      description: >-
        Returns every webhook subscription of the signed-in user,
        oldest first. Other users' subscriptions are never listed. The
        signing secrets are not returned. The checks are the same for
        every webhook subscription route: the token (401, or 503 when
        it cannot be checked), then the `accounts` and
        `webhook-subscriptions` flags for that user (404), then the
        plan (402 on the free plan). Every response carries
        `Cache-Control: no-store`.
      tags: [webhooks]
      x-paid: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The user's subscriptions.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscriptionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "404":
          $ref: "#/components/responses/WebhookSubscriptionNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createWebhookSubscription
      summary: Subscribe to an agency by webhook
      description: >-
        Creates a webhook subscription to a live agency for the
        signed-in user, with a new signing secret. The response is the
        only time the secret is returned; it cannot be read again,
        only rotated. The subscription starts `active`. The URL must
        be `https`. A user may have at most 25 subscriptions (429),
        and one subscription per agency and URL (409). The checks are
        the same for every webhook subscription route: the token (401,
        or 503 when it cannot be checked), then the `accounts` and
        `webhook-subscriptions` flags for that user (404), then the
        plan (402 on the free plan). Every response carries
        `Cache-Control: no-store`.
      tags: [webhooks]
      x-paid: true
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSubscriptionInput"
      responses:
        "201":
          description: The subscription, with its signing secret.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscriptionWithSecret"
        "400":
          $ref: "#/components/responses/InvalidWebhookSubscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "404":
          $ref: "#/components/responses/WebhookSubscriptionNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/WebhookSubscriptionExists"
        "429":
          $ref: "#/components/responses/WebhookSubscriptionLimit"
        "503":
          $ref: "#/components/responses/WebhooksUnavailable"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /webhook-subscriptions/{id}:
    get:
      operationId: getWebhookSubscription
      summary: Get a webhook subscription
      description: >-
        Returns one of the signed-in user's subscriptions, without its
        secret. Another user's subscription is a 404, the same as one
        that does not exist. The checks are the same for every webhook
        subscription route: the token (401, or 503 when it cannot be
        checked), then the `accounts` and `webhook-subscriptions`
        flags for that user (404), then the plan (402 on the free
        plan). Every response carries `Cache-Control: no-store`.
      tags: [webhooks]
      x-paid: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WebhookSubscriptionId"
      responses:
        "200":
          description: The subscription.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "404":
          $ref: "#/components/responses/WebhookSubscriptionNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateWebhookSubscription
      summary: Change, pause or resume a webhook subscription
      description: >-
        Changes the URL, the payload version, the format or the status of one of
        the signed-in user's subscriptions. Members left out are
        unchanged; at least one is required. `status: paused` pauses
        the subscription and `status: active` resumes it. The agency
        and the secret cannot be changed here. The checks are the same
        for every webhook subscription route: the token (401, or 503
        when it cannot be checked), then the `accounts` and
        `webhook-subscriptions` flags for that user (404), then the
        plan (402 on the free plan). Every response carries
        `Cache-Control: no-store`.
      tags: [webhooks]
      x-paid: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WebhookSubscriptionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSubscriptionUpdate"
      responses:
        "200":
          description: The subscription as changed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
        "400":
          $ref: "#/components/responses/InvalidWebhookSubscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "404":
          $ref: "#/components/responses/WebhookSubscriptionNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/WebhookSubscriptionExists"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteWebhookSubscription
      summary: Delete a webhook subscription
      description: >-
        Deletes one of the signed-in user's subscriptions and its
        secret. Deleting it again is a 404. The checks are the same
        for every webhook subscription route: the token (401, or 503
        when it cannot be checked), then the `accounts` and
        `webhook-subscriptions` flags for that user (404), then the
        plan (402 on the free plan). Every response carries
        `Cache-Control: no-store`.
      tags: [webhooks]
      x-paid: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WebhookSubscriptionId"
      responses:
        "204":
          description: The subscription was deleted.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "404":
          $ref: "#/components/responses/WebhookSubscriptionNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /webhook-subscriptions/{id}/secret:
    post:
      operationId: rotateWebhookSubscriptionSecret
      summary: Rotate a webhook subscription's signing secret
      description: >-
        Replaces the signing secret of one of the signed-in user's
        subscriptions with a new one and returns it. The old secret
        stops being used at once. The response is the only time the
        new secret is returned. The checks are the same for every
        webhook subscription route: the token (401, or 503 when it
        cannot be checked), then the `accounts` and
        `webhook-subscriptions` flags for that user (404), then the
        plan (402 on the free plan). Every response carries
        `Cache-Control: no-store`.
      tags: [webhooks]
      x-paid: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WebhookSubscriptionId"
      responses:
        "200":
          description: The subscription, with its new signing secret.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscriptionWithSecret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "404":
          $ref: "#/components/responses/WebhookSubscriptionNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/WebhooksUnavailable"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /webhook-subscriptions/{id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: List a webhook subscription's deliveries
      description: >-
        The delivery log of one of the signed-in user's subscriptions: one
        entry per meeting event the subscription was sent, with every attempt
        at sending it. Entries are newest first by their first attempt, ties
        broken by event id, and go back as far as attempts are kept. Pages are
        keyset-paginated: pass `nextCursor` from one page as `cursor` to get
        the next. A delivery first tried between requests never causes
        another to be skipped or repeated; a retry of a listed delivery adds
        an attempt to it without moving it. A delivery appears once its first
        attempt is stored; one still waiting for its first attempt is not
        listed. Test sends are not listed. Another user's subscription is a
        404, the same as one that does not exist. The checks are the same for
        every webhook subscription route: the token (401, or 503 when it
        cannot be checked), then the `accounts` and `webhook-subscriptions`
        flags for that user (404), then the plan (402 on the free plan).
        Every response carries `Cache-Control: no-store`.
      tags: [webhooks]
      x-paid: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WebhookSubscriptionId"
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque cursor from a previous page's `nextCursor`. Omit for the
            first page. A cursor that is malformed, altered, or from another
            subscription is rejected with 400 `invalid_cursor`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of deliveries to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One page of the subscription's deliveries.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "404":
          $ref: "#/components/responses/WebhookSubscriptionNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /webhook-subscriptions/{id}/test:
    post:
      operationId: sendWebhookTest
      summary: Send a test webhook
      description: >-
        Sends one sample event to one of the signed-in user's subscriptions
        now and answers with the result. The request is signed and sent
        exactly as a real delivery, with the subscription's URL, format,
        payload version and current secret. A `standard` body has `test:
        true`; a Discord or Slack message's label starts with `Test: `. The
        event, meeting, agenda and transcript ids in it are new random ids
        that exist nowhere else, so each test has its own `webhook-id`. A
        paused subscription can be tested too. The URL's addresses are
        checked first, as when saving it; a refused URL is answered 200 with
        `succeeded: false` and nothing is sent. The receiver's answer,
        whatever it is, is also a 200 with the result. There are no retries,
        and test sends are not stored in the delivery log. A user may send at
        most 10 tests a minute (429). The checks are the same for every
        webhook subscription route: the token (401, or 503 when it cannot be
        checked), then the `accounts` and `webhook-subscriptions` flags for
        that user (404), then the plan (402 on the free plan). Every
        response carries `Cache-Control: no-store`.
      tags: [webhooks]
      x-paid: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WebhookSubscriptionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookTestInput"
      responses:
        "200":
          description: The test was attempted; the result says how it went.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookTestResult"
        "400":
          $ref: "#/components/responses/InvalidWebhookSubscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "404":
          $ref: "#/components/responses/WebhookSubscriptionNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/WebhookTestLimit"
        "503":
          $ref: "#/components/responses/WebhooksUnavailable"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    WebhookSubscriptionId:
      name: id
      in: path
      required: true
      description: The subscription's id.
      schema:
        type: string
        format: uuid
    AgencySlug:
      name: slug
      in: path
      required: true
      description: The agency's slug, e.g. `la-metro`.
      schema:
        type: string
    AgencySubmissionId:
      name: id
      in: path
      required: true
      description: The submitted agency's id.
      schema:
        type: string
        format: uuid
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >-
        ETags from earlier responses. When one matches the current feed, the
        response is 304 with no body.
      schema:
        type: string
  headers:
    ETag:
      description: Strong validator of the feed body; changes whenever the body does.
      schema:
        type: string
    CacheControl:
      description: How long caches and feed readers may reuse the response.
      schema:
        type: string
    NoStore:
      description: Always `no-store`.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A WorkOS AuthKit access token.
  responses:
    AgencyFeed:
      description: >-
        The feed, an RSS 2.0 document in UTF-8 with an Atom self link. Item
        titles are plain text; item descriptions are HTML-escaped plain text,
        so readers never render agency or AI text as markup.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/rss+xml; charset=utf-8:
          schema:
            type: string
    NotModified:
      description: The feed has not changed since the ETag the client sent.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
    Unauthorized:
      description: >-
        The request has no bearer token, or the token is not valid. `code` is
        `unauthorized`; the message does not say why the token was rejected.
      headers:
        WWW-Authenticate:
          description: Always `Bearer`.
          required: true
          schema:
            type: string
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        The token is valid but the signed-in user may not use this route,
        for example a route for admins only. `code` is `forbidden`. The role
        is read from the database on every request, so a change takes effect
        on the next one; signing in again does not help.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AuthUnavailable:
      description: >-
        The token cannot be checked right now. `code` is
        `auth_not_configured` when the API has no WorkOS client id and
        `auth_unavailable` when WorkOS's signing keys cannot be fetched, or
        when the token's signing key is not in the cached key set and the
        set cannot be refreshed yet. A client should retry later and must
        not sign the user out.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentRequired:
      description: >-
        The token is valid but the route needs the paid plan and the
        signed-in user is on the free plan. `code` is `payment_required`.
        The plan is read from the database on every request, so it takes
        effect as soon as Stripe's confirmation has been processed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidStripeEvent:
      description: >-
        The event was refused. `code` is `invalid_signature` when the
        `Stripe-Signature` header is missing, malformed, does not match the
        body or is too old, `invalid_event` when a correctly signed event
        cannot be read, and `invalid_body` when the body is not JSON.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StripeEventTooLarge:
      description: The body is larger than 1 MiB. `code` is `body_too_large`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StripeWebhookNotConfigured:
      description: >-
        The API has no valid `STRIPE_WEBHOOK_SECRET`. `code` is
        `billing_not_configured`. Stripe retries the event later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BillingRedirect:
      description: The Stripe page to send the browser to.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BillingRedirect"
    BillingConflict:
      description: >-
        The request cannot be done for this user. `code` is
        `already_subscribed` when the user already has a live Stripe
        subscription (send them to the billing portal instead) and
        `no_billing_customer` when the user has never started checkout.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BillingFailed:
      description: >-
        Stripe did not answer or refused the request. `code` is
        `billing_unavailable`; the client may retry later.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BillingUnavailable:
      description: >-
        Billing cannot be used right now. `code` is `billing_not_configured`
        when the API has no Stripe configuration, or `auth_not_configured` or
        `auth_unavailable` when the token cannot be checked (see
        `AuthUnavailable`). A client must not sign the user out on it.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: >-
        A parameter or the request body is invalid. `code` is
        `invalid_cursor` for a bad cursor, `invalid_parameter` for any other
        parameter and `invalid_body` for a body that cannot be decoded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >-
        No live agency has this slug, no meeting of a live agency has this
        id, no submitted agency has this id, or the route is turned off for
        the signed-in user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidSubmission:
      description: >-
        The body is not valid. `code` is `invalid_body`, with no `fields`,
        when it is not a single JSON object, has a member other than `name`
        and `website`, names a member twice, has a member that is not a
        string, or has data after the object; `code` is
        `invalid_submission` when a field is invalid, with one entry in
        `fields` per invalid field. A missing member counts as empty.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    AlreadyOnFile:
      description: >-
        An agency with the same site is already on file. `code` is
        `already_on_file`; the response says nothing about that agency.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: The body is larger than the endpoint accepts. `code` is `body_too_large`.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: >-
        The body is not declared as `application/json` in UTF-8. `code` is
        `unsupported_media_type`.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SubmissionLimit:
      description: >-
        The user already has as many submissions awaiting review as one user
        may have. `code` is `submission_limit_reached`. Waiting does not help;
        the limit frees up as submissions are reviewed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidWebhookSubscription:
      description: >-
        The body or the id is not valid. `code` is `invalid_parameter` for an
        id that is not a UUID and `invalid_body` for a body that is not a JSON
        object of the documented members. Otherwise `code` names the problem:
        `unknown_agency` when no live agency has the slug,
        `invalid_payload_version`, `invalid_status`, `nothing_to_update` for
        an update with no members, `invalid_event_type` for a test of a type
        that is not a `WebhookEventType`, or, for the URL, `required`, `too_long`,
        `invalid_url`, `unsupported_scheme` (not `https`), `credentials`,
        `fragment`, `not_public` when the host is, or resolves to, an address
        that is not on the public internet (private, loopback, link-local,
        cloud metadata or reserved), or `unresolvable_host` when the host
        name has no address or cannot be looked up.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WebhookSubscriptionNotFound:
      description: >-
        The signed-in user has no subscription with this id (another user's
        subscription is not found either), or webhook subscriptions are
        turned off for the user. `code` is `not_found`.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WebhookSubscriptionExists:
      description: >-
        The user already has a subscription to this agency at this URL.
        `code` is `already_subscribed`.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WebhookSubscriptionLimit:
      description: >-
        The user already has 25 subscriptions. `code` is
        `subscription_limit_reached`; deleting one frees a place.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WebhookTestLimit:
      description: >-
        The user has sent 10 tests in the last minute. `code` is
        `test_limit_reached`; `Retry-After` says when the next one is
        allowed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          description: Seconds until the next test is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WebhooksUnavailable:
      description: >-
        A signing secret cannot be made or used right now. `code` is
        `webhooks_not_configured` when the API has no key to store secrets
        with or cannot send tests, or `auth_not_configured` or `auth_unavailable` when the token
        cannot be checked (see `AuthUnavailable`).
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidApproval:
      description: >-
        The approval is not valid. `code` is `invalid_body` when the body
        cannot be decoded and `invalid_slug` when the slug does not follow
        the rules on `AgencyApprovalInput`; `invalid_parameter` when the id
        is not a UUID.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReviewConflict:
      description: >-
        The agency cannot be reviewed as asked. `code` is `not_pending` when
        it has already been approved or rejected, and `slug_taken` when
        another agency already has the slug.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MethodNotAllowed:
      description: The path does not support the requested method.
      headers:
        Allow:
          description: Methods the path supports.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    StripeEvent:
      type: object
      description: >-
        A Stripe event object, as Stripe sends it. Only the members below
        are read; the signature covers the raw body.
      required: [id, type]
      additionalProperties: true
      properties:
        id:
          type: string
        type:
          type: string
        created:
          type: integer
          format: int64
    StripeEventReceipt:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [applied, duplicate, stale, unknown_customer, ignored]
          description: >-
            `applied` changed the subscription's stored state and recomputed
            the plan; `duplicate` is an event id already processed;
            `stale` is older than the last event applied to its
            subscription, or the subscription has already ended;
            `unknown_customer` is for a Stripe customer no user has; and
            `ignored` is an event type, or a checkout that is not a paid
            subscription, that does not change the plan.
    BillingRedirect:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: An `https` URL on Stripe. Single use; do not store it.
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: Build version (git SHA) of the running API.
    Agency:
      type: object
      required: [id, slug, name, website]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: URL-safe identifier, e.g. `la-metro`.
        name:
          type: string
        website:
          type: string
          format: uri
          description: The agency's official website.
    AgencyList:
      type: object
      required: [agencies]
      properties:
        agencies:
          type: array
          items:
            $ref: "#/components/schemas/Agency"
    MeetingStatus:
      type: string
      enum: [scheduled, held, cancelled]
    MeetingSummary:
      type: object
      description: >-
        A meeting as listed on its agency's page. New optional fields may be
        added; clients must ignore fields they do not know.
      required: [id, title, startsAt, status]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        startsAt:
          type: string
          format: date-time
          description: When the meeting starts.
        status:
          $ref: "#/components/schemas/MeetingStatus"
        sourceUrl:
          type: string
          format: uri
          description: >-
            The agency's own page for the meeting. Absent when the source gave
            none.
    MeetingList:
      type: object
      required: [meetings, nextCursor]
      properties:
        meetings:
          type: array
          items:
            $ref: "#/components/schemas/MeetingSummary"
        nextCursor:
          type: string
          nullable: true
          description: >-
            Pass as `cursor` to get the next page. Null on the last page.
    MeetingDetail:
      type: object
      description: >-
        A meeting with its agenda and transcripts. New optional fields may be
        added; clients must ignore fields they do not know.
      required: [id, agency, title, startsAt, status, agenda, recordings]
      properties:
        id:
          type: string
          format: uuid
        agency:
          $ref: "#/components/schemas/Agency"
        title:
          type: string
        startsAt:
          type: string
          format: date-time
          description: When the meeting starts.
        status:
          $ref: "#/components/schemas/MeetingStatus"
        sourceUrl:
          type: string
          format: uri
          description: >-
            The agency's own page for the meeting. Absent when the source gave
            none.
        agenda:
          description: The latest agenda version. Null until an agenda is published.
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Agenda"
        recordings:
          type: array
          description: >-
            The meeting's recordings in the order they were found. Empty until
            a recording is available; a meeting split into several videos has
            several.
          items:
            $ref: "#/components/schemas/Recording"
    Agenda:
      type: object
      required: [version, documentUrl, summary, changeNote, foundAt]
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
          description: The version number, 1 for the first agenda published.
        documentUrl:
          type: string
          format: uri
          description: The agency's original agenda document.
        summary:
          type: string
          nullable: true
          description: AI summary of the agenda. Null until it is written.
        changeNote:
          type: string
          nullable: true
          description: >-
            What changed from the previous version. Null for the first version
            and until it is written.
        foundAt:
          type: string
          format: date-time
          description: When this version was first found by the service.
    Recording:
      type: object
      required: [sourceUrl, transcript]
      properties:
        sourceUrl:
          type: string
          format: uri
          description: The agency's original recording.
        transcript:
          description: The recording's transcript. Null until it is ready.
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Transcript"
    Transcript:
      type: object
      required: [summary, segments]
      properties:
        summary:
          type: string
          nullable: true
          description: AI summary of the transcript. Null until it is written.
        segments:
          type: array
          description: The full transcript as timestamped segments, in order.
          items:
            $ref: "#/components/schemas/TranscriptSegment"
    TranscriptSegment:
      type: object
      required: [startMs, endMs, text]
      properties:
        startMs:
          type: integer
          format: int64
          minimum: 0
          description: Start, in milliseconds from the start of the recording.
        endMs:
          type: integer
          format: int64
          minimum: 0
          description: End, in milliseconds from the start of the recording.
        text:
          type: string
    User:
      type: object
      required: [id, email, role, plan, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: The user's id in this service.
        email:
          type: string
          nullable: true
          description: >-
            The email address from the latest access token that carried one,
            or null when none has. Not an identifier: it can change.
        role:
          type: string
          enum: [user, admin]
          description: >-
            What the user may do. `admin` may use the admin routes; everyone
            else is `user`, which is also the role of a new user. Read from
            the database on every request, never from the token.
        plan:
          type: string
          enum: [free, paid]
          description: >-
            The user's plan. `paid` while one of the subscriptions of the
            user's Stripe customer is `active`, `trialing` or `past_due`, as
            last reported by Stripe's webhooks; `free` otherwise, which is
            also the plan of a new user.
        createdAt:
          type: string
          format: date-time
          description: When the user was first seen.
    AgencySubmissionInput:
      type: object
      required: [name, website]
      properties:
        name:
          type: string
          description: >-
            The agency's name, plain text. Surrounding and repeated whitespace
            is collapsed; 2 to 200 characters after that, with at least one
            letter or digit and no control or invisible formatting characters.
        website:
          type: string
          description: >-
            The agency's website, an `http` or `https` URL on a public host
            name, at most 2,048 characters. Without a scheme, `https://` is
            assumed.
    AgencySubmission:
      type: object
      required: [id, name, website, status, submittedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The name as stored, after trimming.
        website:
          type: string
          format: uri
          description: >-
            The website as stored: scheme, lower-case host and path, without
            query, fragment, default port or trailing slash.
        status:
          type: string
          enum: [pending]
          x-enum-varnames: [AgencySubmissionStatusPending]
        submittedAt:
          type: string
          format: date-time
    WebhookSubscriptionInput:
      type: object
      required: [agency, url]
      properties:
        agency:
          type: string
          description: The slug of the live agency to subscribe to.
        url:
          type: string
          description: >-
            Where to send the webhooks: an absolute `https` URL of at most
            2,048 bytes, without a user name, password or fragment, whose host
            is a public IP address or a name that resolves only to public
            addresses. The scheme and host are stored in lower case; the path
            and query as given.
        payloadVersion:
          $ref: "#/components/schemas/WebhookPayloadVersion"
        format:
          $ref: "#/components/schemas/WebhookFormat"
    WebhookSubscriptionUpdate:
      type: object
      properties:
        url:
          type: string
          description: >-
            A new URL, with the same rules as when creating. The host's
            addresses are checked only when the URL differs from the stored
            one.
        payloadVersion:
          $ref: "#/components/schemas/WebhookPayloadVersion"
        format:
          $ref: "#/components/schemas/WebhookFormat"
        status:
          $ref: "#/components/schemas/WebhookSubscriptionStatus"
    WebhookPayloadVersion:
      type: string
      enum: [v1]
      x-enum-varnames: [WebhookPayloadV1]
      default: v1
      description: >-
        The version of the `standard` payload to send. `v1` is the only one.
        The `discord` and `slack` formats ignore it.
    WebhookFormat:
      type: string
      enum: [standard, discord, slack]
      x-enum-varnames: [WebhookFormatStandard, WebhookFormatDiscord, WebhookFormatSlack]
      default: standard
      description: >-
        The shape of each delivery's body. `standard`: the versioned event
        described by `WebhookEventV1`. `discord`: a message for a Discord
        incoming webhook (Execute Webhook), with one embed. `slack`: a message
        for a Slack incoming webhook, with Block Kit blocks and a `text`
        fallback. The presets are rendered from the same event, cut to fit
        the service's limits; text that is cut ends with `…` and the message
        links to the meeting's page. Agency text is shown as text, never as
        Markdown, and mentions are not sent. Every format is sent with the
        same `webhook-id`, `webhook-timestamp` and `webhook-signature`
        headers. The URL is not checked against the format.
    WebhookSubscriptionStatus:
      type: string
      enum: [active, paused]
      x-enum-varnames: [WebhookSubscriptionActive, WebhookSubscriptionPaused]
      description: >-
        Whether the subscription is to be sent webhooks: `active` ones are,
        `paused` ones are not.
    WebhookSubscription:
      type: object
      required: [id, agency, url, payloadVersion, format, status, createdAt, updatedAt, secretRotatedAt]
      properties:
        id:
          type: string
          format: uuid
        agency:
          type: string
          description: The slug of the agency.
        url:
          type: string
          format: uri
          description: The URL as stored.
        payloadVersion:
          $ref: "#/components/schemas/WebhookPayloadVersion"
        format:
          $ref: "#/components/schemas/WebhookFormat"
        status:
          $ref: "#/components/schemas/WebhookSubscriptionStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: When the subscription or its secret last changed.
        secretRotatedAt:
          type: string
          format: date-time
          description: When the current signing secret was made.
    WebhookSubscriptionWithSecret:
      allOf:
        - $ref: "#/components/schemas/WebhookSubscription"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: >-
                The signing secret, `whsec_` followed by 32 random bytes in
                standard base64. Returned only in this response; store it
                now.
    WebhookSubscriptionList:
      type: object
      required: [subscriptions]
      properties:
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/WebhookSubscription"
    WebhookDeliveryList:
      type: object
      required: [deliveries, nextCursor]
      properties:
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"
        nextCursor:
          type: string
          nullable: true
          description: >-
            Pass as `cursor` to get the next page. Null on the last page.
    WebhookDelivery:
      type: object
      description: >-
        One meeting event sent to the subscription, with its attempts. New
        optional members may be added; clients must ignore members they do
        not know.
      required: [eventId, type, meeting, succeeded, firstAttemptAt, lastAttemptAt, attempts]
      properties:
        eventId:
          type: string
          format: uuid
          description: The event's id, sent as `webhook-id` and as the payload's `id`.
        type:
          $ref: "#/components/schemas/WebhookEventType"
        meeting:
          $ref: "#/components/schemas/WebhookMeeting"
        succeeded:
          type: boolean
          description: Whether any attempt was answered with a 2xx.
        firstAttemptAt:
          type: string
          format: date-time
        lastAttemptAt:
          type: string
          format: date-time
        attempts:
          type: array
          description: Every stored attempt, in the order they were made.
          items:
            $ref: "#/components/schemas/WebhookDeliveryAttempt"
    WebhookDeliveryAttempt:
      type: object
      required: [attempt, startedAt, durationMs, statusCode, error, succeeded]
      properties:
        attempt:
          type: integer
          minimum: 1
          description: 1 for the first try, then counting up.
        startedAt:
          type: string
          format: date-time
          description: When the attempt was signed and sent.
        durationMs:
          type: integer
          minimum: 0
          description: How long the request took, in milliseconds.
        statusCode:
          type: integer
          nullable: true
          description: The receiver's HTTP status. Null when there was no answer.
        error:
          type: string
          nullable: true
          description: >-
            Why the attempt failed without an answer (a timeout, a refused
            address, a connection error), in plain text. Null for an HTTP
            answer, which `statusCode` describes.
        succeeded:
          type: boolean
          description: Whether the receiver answered with a 2xx.
    WebhookTestInput:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/WebhookEventType"
    WebhookTestResult:
      type: object
      required: [id, type, sentAt, succeeded, statusCode, durationMs, error]
      properties:
        id:
          type: string
          format: uuid
          description: The test event's id, sent as `webhook-id` and as the payload's `id`.
        type:
          $ref: "#/components/schemas/WebhookEventType"
        sentAt:
          type: string
          format: date-time
          description: When the test was signed, the `webhook-timestamp` sent.
        succeeded:
          type: boolean
          description: Whether the receiver answered with a 2xx.
        statusCode:
          type: integer
          nullable: true
          description: The receiver's HTTP status. Null when there was no answer.
        durationMs:
          type: integer
          minimum: 0
          description: How long the request took, in milliseconds. 0 when nothing was sent.
        error:
          type: string
          nullable: true
          description: >-
            Why the test failed without an answer: the URL's addresses were
            refused, the request timed out or could not connect. Plain text.
            Null for an HTTP answer, which `statusCode` describes.
    PendingAgencySubmissionList:
      type: object
      required: [submissions]
      properties:
        submissions:
          type: array
          items:
            $ref: "#/components/schemas/PendingAgencySubmission"
    PendingAgencySubmission:
      type: object
      required: [id, name, website, submittedAt, submittedBy]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The name as submitted, after trimming. Plain text.
        website:
          type: string
          description: >-
            The website as stored. It has not been fetched or checked beyond
            the submission rules; show it as text, not as a link.
        submittedAt:
          type: string
          format: date-time
        submittedBy:
          $ref: "#/components/schemas/Submitter"
    Submitter:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
          description: The submitter's id in this service.
        email:
          type: string
          nullable: true
          description: The submitter's latest email, or null when none is known.
    AgencyApprovalInput:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
          description: >-
            The live agency's slug, used in its public URL and to register
            its source adapter: 2 to 60 lower-case letters, digits and single
            hyphens, starting and ending with a letter or digit, not starting
            with `submitted-`, and not used by another agency.
    ReviewedAgencySubmission:
      type: object
      required: [id, slug, name, website, status]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: >-
            The chosen slug for a live agency; the private `submitted-` slug
            for a rejected one.
        name:
          type: string
        website:
          type: string
        status:
          type: string
          enum: [live, rejected]
          x-enum-varnames: [ReviewedAgencySubmissionStatusLive, ReviewedAgencySubmissionStatusRejected]
    WebhookEventType:
      type: string
      enum: [agenda_published, agenda_changed, transcript_ready]
      x-enum-varnames: [WebhookAgendaPublished, WebhookAgendaChanged, WebhookTranscriptReady]
      description: >-
        What happened to the meeting. `agenda_published`: its first agenda was
        found. `agenda_changed`: a later agenda differs from the one before.
        `transcript_ready`: a recording's transcript and its summary are
        ready. New types may be added; receivers must ignore types they do not
        know.
    WebhookEventV1:
      type: object
      description: >-
        The body of a webhook delivery with payload version `v1`, sent as
        `POST` with `Content-Type: application/json` to the subscription's URL.
        Not a route of this API: Civic Scanner sends it to subscribers. Each
        request carries the Standard Webhooks headers: `webhook-id` (the
        event's `id`, the same on every retry and at every subscriber, so a
        receiver can drop duplicates), `webhook-timestamp` (when this attempt
        was signed, in Unix seconds) and `webhook-signature` (`v1,` followed
        by the standard base64 HMAC-SHA256 of `{webhook-id}.{webhook-timestamp}.{body}`,
        keyed with the bytes the subscription's `whsec_` secret encodes). Any
        2xx answer is a delivery; anything else, a redirect included, is
        retried. New optional members may be added; receivers must ignore
        members they do not know.
      required: [id, type, payloadVersion, occurredAt, agency, meeting]
      properties:
        id:
          type: string
          format: uuid
          description: The event's id, repeated in the `webhook-id` header.
        type:
          $ref: "#/components/schemas/WebhookEventType"
        payloadVersion:
          $ref: "#/components/schemas/WebhookPayloadVersion"
        occurredAt:
          type: string
          format: date-time
          description: >-
            When what the event describes happened. For `agenda_changed`, when
            the change was found, which can be earlier than the delivery of an
            event sent before it.
        agency:
          $ref: "#/components/schemas/WebhookAgency"
        meeting:
          $ref: "#/components/schemas/WebhookMeeting"
        agenda:
          $ref: "#/components/schemas/WebhookAgenda"
        transcript:
          $ref: "#/components/schemas/WebhookTranscript"
        test:
          type: boolean
          description: >-
            `true` on a test sent with `POST
            /webhook-subscriptions/{id}/test`, whose event, meeting, agenda
            and transcript ids are made up and found nowhere in the API.
            Absent on real deliveries.
    WebhookAgency:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
    WebhookMeeting:
      type: object
      required: [id, title, startsAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        startsAt:
          type: string
          format: date-time
        sourceUrl:
          type: string
          format: uri
          description: >-
            The agency's own page for the meeting. Absent when the source gave
            none.
    WebhookAgenda:
      type: object
      description: Present for `agenda_published` and `agenda_changed`.
      required: [versionId, version]
      properties:
        versionId:
          type: string
          format: uuid
          description: The agenda version the event is about.
        version:
          type: integer
          minimum: 1
          description: 1 for the first agenda of the meeting, then counting up.
        changeNote:
          type: string
          description: >-
            For `agenda_changed`, what changed, in plain text. Absent when the
            change was recorded without a note. Agency and model text: show it
            as text, never as HTML or Markdown.
        changeNoteSource:
          type: string
          enum: [model, diff]
          x-enum-varnames: [WebhookChangeNoteFromModel, WebhookChangeNoteFromDiff]
          description: >-
            Who wrote `changeNote`: `model` when a language model described
            the change, `diff` when it was built from the word differences.
    WebhookTranscript:
      type: object
      description: Present for `transcript_ready`.
      required: [id, recordingId]
      properties:
        id:
          type: string
          format: uuid
        recordingId:
          type: string
          format: uuid
    ValidationError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Human-readable explanation.
        fields:
          type: array
          description: One entry per invalid field, when the fields could be read.
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          enum: [name, website]
          x-enum-varnames: [FieldErrorFieldName, FieldErrorFieldWebsite]
        code:
          type: string
          description: >-
            Why the field is invalid: `required`, `too_short`, `too_long` or
            `invalid_characters` for `name`; `required`, `too_long`,
            `invalid_url`, `unsupported_scheme`, `credentials`, `port`,
            `ip_address`, `not_public` or `invalid_host` for `website`.
        message:
          type: string
          description: Human-readable explanation, fit to show next to the field.
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Human-readable explanation.
